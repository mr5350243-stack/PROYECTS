<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Detrás del Porqué · Prueba de atención</title>
<style>
  @font-face { font-family: M; font-weight: 800; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2); }
  @font-face { font-family: M; font-weight: 900; src: url(/node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2); }
  html, body { margin: 0; background: #0b1636; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
  text { font-family: M, sans-serif; }
</style>
</head>
<body>
<svg id="svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#1b3170"/><stop offset="0.55" stop-color="#0f1d48"/><stop offset="1" stop-color="#070f28"/></radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%"><stop offset="0.42" stop-color="#ffd25a"/><stop offset="0.7" stop-color="#ff9a3c"/><stop offset="1" stop-color="#e2581f"/></radialGradient>
    <linearGradient id="scleraShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9cfe0"/><stop offset="0.35" stop-color="#f6f3ec"/><stop offset="1" stop-color="#ece6da"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1a44"/><stop offset="1" stop-color="#1a2f6a"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9a65a"/><stop offset="1" stop-color="#f6c47e"/></linearGradient>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffb36a"/><stop offset="1" stop-color="#e2581f"/></radialGradient>
    <radialGradient id="yball" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff2a8"/><stop offset="1" stop-color="#ffc21f"/></radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#020617" stop-opacity="0.5"/></radialGradient>
    <linearGradient id="labWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16295f"/><stop offset="1" stop-color="#22408a"/></linearGradient>
    <radialGradient id="winGlow" cx="70%" cy="20%" r="80%"><stop offset="0" stop-color="#fff6d8" stop-opacity="0.9"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
    <linearGradient id="screenGlare" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe9a0" stop-opacity="0.85"/><stop offset="1" stop-color="#ffc93c" stop-opacity="0.25"/></linearGradient>
    <radialGradient id="lensGlass" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#9fd3ff" stop-opacity="0.08"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blurFg" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="capShadow" x="-10%" y="-30%" width="120%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.55"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>
  <g id="world"></g>
  <g id="caps"></g>
  <rect width="1080" height="1920" fill="url(#vig)" pointer-events="none"/>
</svg>
<script type="module" src="src/main.js"></script>
</body>
</html>
