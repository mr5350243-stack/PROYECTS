<body>

<script>
// ------------------------------------------------------------------ utilidades
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const set = (e, attrs) => { for (const k in attrs) e.setAttribute(k, attrs[k]); };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: (x) => x,
  out: (x) => 1 - Math.pow(1 - x, 3),
  inOut: (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  in: (x) => x * x * x,
  inExpo: (x) => x === 0 ? 0 : Math.pow(2, 10 * x - 10),
  back: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  elastic: (x) => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI) / 3.2) + 1,
};
const ramp = (t, a, b, e = E.lin) => e(clamp((t - a) / (b - a)));
const C = { navy: '#0b1636', navy2: '#16285e', white: '#f6f3ec', yellow: '#ffc93c', orange: '#ff7a2f', ink: '#081128' };

// ------------------------------------------------------------------ tiempos (ajustados a la locución editada)
const T = { s2: 3.2, freeze: 7.85, end: 10.0 };
window.DURATION = T.end;

// ------------------------------------------------------------------ fondo: puntos editoriales
(() => {
  const g = $('bgDeco');
  for (let i = 0; i < 60; i++) {
    const x = (i * 197) % 1080, y = (i * 331) % 1920, r = 2 + (i % 3);
    el('circle', { cx: x, cy: y, r, fill: '#2a4796', opacity: 0.35 }, g);
  }
})();

// ------------------------------------------------------------------ ESCENA 1: el ojo
const EYE = { x: 540, y: 880 };
const eyeG = $('eye');
set(eyeG, { transform: `translate(${EYE.x},${EYE.y})` });
const eyeShadow = el('ellipse', { cx: 0, cy: 30, rx: 420, ry: 250, fill: '#050b20', opacity: 0.45, filter: 'url(#soft)' }, eyeG);
const scl = el('path', { fill: 'url(#scleraShade)' }, eyeG);
const irisG = el('g', { 'clip-path': 'url(#eyeClip)' }, eyeG);
const irisInner = el('g', {}, irisG);
el('circle', { r: 150, fill: 'url(#iris)' }, irisInner);
for (let i = 0; i < 28; i++) {
  const a = i / 28 * Math.PI * 2;
  el('line', { x1: Math.cos(a) * 72, y1: Math.sin(a) * 72, x2: Math.cos(a) * 140, y2: Math.sin(a) * 140, stroke: '#c94a14', 'stroke-width': 4, opacity: 0.35, 'stroke-linecap': 'round' }, irisInner);
}
el('circle', { r: 150, fill: 'none', stroke: '#9b3510', 'stroke-width': 8, opacity: 0.6 }, irisInner);
const pupil = el('circle', { r: 66, fill: C.ink }, irisInner);
el('circle', { cx: -40, cy: -44, r: 22, fill: '#fff', opacity: 0.95 }, irisInner);
el('circle', { cx: 46, cy: 40, r: 9, fill: '#fff', opacity: 0.7 }, irisInner);
const lidTop = el('path', { fill: 'none', stroke: C.white, 'stroke-width': 16, 'stroke-linecap': 'round' }, eyeG);
const lidBot = el('path', { fill: 'none', stroke: '#8fa3d8', 'stroke-width': 6, 'stroke-linecap': 'round', opacity: 0.7 }, eyeG);
const lidFill = el('path', { fill: '#24408a' }, eyeG); // párpado que baja en el parpadeo
const lashes = [];
for (let i = 0; i < 7; i++) lashes.push(el('line', { stroke: C.white, 'stroke-width': 10, 'stroke-linecap': 'round' }, eyeG));
const brow = el('path', { d: 'M -300 -330 Q 0 -420 300 -330', fill: 'none', stroke: '#2f4c9c', 'stroke-width': 26, 'stroke-linecap': 'round' }, eyeG);

const almond = (o, w = 380, h = 250) => `M ${-w} 0 Q 0 ${-h * o * 1.0} ${w} 0 Q 0 ${h * o} ${-w} 0 Z`;
function qpt(t, w, h) { // punto en la curva superior del párpado (cuadrática)
  const x = (1 - t) * (1 - t) * -w + t * t * w, y = 2 * (1 - t) * t * -h;
  const dx = 2 * (1 - t) * (0 + w) + 2 * t * (w - 0), dy = 2 * (1 - t) * -h + 2 * t * h;
  return { x, y, nx: dy, ny: -dx };
}

// pelota amarilla que sigue la pupila
const yb = $('yellowBall');
const ybTrail = [0, 1, 2, 3].map(i => el('circle', { r: 26 - i * 4, fill: C.yellow, opacity: 0.25 - i * 0.05 }, yb));
const ybShadow = el('ellipse', { rx: 30, ry: 8, fill: '#020617', opacity: 0.4 }, yb);
const ybBall = el('circle', { r: 28, fill: 'url(#yball)' }, yb);
function yellowPos(t) {
  // rebota de lado a lado bajo el ojo y al final salta dentro de la pupila
  const x = 540 + 320 * Math.sin(t * 2.3 - 0.4);
  const y = 1330 - 230 * Math.abs(Math.sin(t * 4.6));
  return { x, y };
}

// ------------------------------------------------------------------ ESCENA 2: la cancha
const court = $('court'), actors = $('actors'), ballsFx = $('ballsFx');
const HOR = 640; // línea del fondo de la cancha
function proj(u, v) { // u: -1..1 lateral, v: 0 (fondo) .. 1 (cerca)
  const y = HOR + 40 + Math.pow(v, 1.15) * 1080;
  const half = lerp(330, 760, v);
  return { x: 540 + u * half, y, s: lerp(0.58, 1.18, v) };
}
(() => {
  el('rect', { width: 1080, height: HOR + 60, fill: 'url(#wall)' }, court);
  // gradas estilizadas con público
  for (let r = 0; r < 4; r++) {
    const y = 300 + r * 82;
    el('rect', { x: 0, y, width: 1080, height: 70, fill: r % 2 ? '#162a63' : '#13255a' }, court);
    for (let i = 0; i < 16; i++) {
      const x = 30 + i * 68 + (r % 2) * 34;
      const c = ['#24408a', '#2c4c9e', '#1f3a80'][(i + r) % 3];
      el('circle', { cx: x, cy: y + 18, r: 17, fill: c }, court);
      el('rect', { x: x - 24, y: y + 34, width: 48, height: 36, rx: 16, fill: c }, court);
    }
  }
  // banda publicitaria / marcador
  el('rect', { x: 0, y: 610, width: 1080, height: 40, fill: '#0a1638' }, court);
  for (let i = 0; i < 9; i++) el('rect', { x: 20 + i * 120, y: 622, width: 70, height: 16, rx: 8, fill: i % 2 ? C.orange : C.yellow, opacity: 0.55 }, court);
  // suelo en perspectiva
  const a = proj(-1.25, 0), b = proj(1.25, 0), c = proj(1.25, 1.25), d = proj(-1.25, 1.25);
  el('path', { d: `M ${a.x - 300} ${HOR + 40} L ${b.x + 300} ${HOR + 40} L 1500 1920 L -420 1920 Z`, fill: 'url(#floor)' }, court);
  // tablas del parqué
  for (let i = -10; i <= 10; i++) {
    const p0 = proj(i * 0.16, 0), p1 = proj(i * 0.16, 1.3);
    el('line', { x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y, stroke: '#d08a40', 'stroke-width': 2, opacity: 0.35 }, court);
  }
  // líneas de la cancha
  const line = (pts) => el('path', { d: 'M ' + pts.map(p => `${p.x} ${p.y}`).join(' L '), fill: 'none', stroke: '#fff7ea', 'stroke-width': 7, opacity: 0.9, 'stroke-linejoin': 'round' }, court);
  line([proj(-1, 0.02), proj(1, 0.02)]);
  line([proj(-1, 0.02), proj(-1, 1.3)]); line([proj(1, 0.02), proj(1, 1.3)]);
  // zona y semicírculo
  line([proj(-0.36, 0.02), proj(-0.36, 0.42), proj(0.36, 0.42), proj(0.36, 0.02)]);
  const arc = []; for (let i = 0; i <= 24; i++) { const a = Math.PI * i / 24; arc.push(proj(Math.cos(a) * 0.36, 0.42 + Math.sin(a) * 0.2)); }
  line(arc);
  // canasta al fondo
  el('rect', { x: 470, y: 470, width: 140, height: 92, rx: 6, fill: '#f6f3ec', opacity: 0.95 }, court);
  el('rect', { x: 512, y: 512, width: 56, height: 40, fill: 'none', stroke: C.orange, 'stroke-width': 5 }, court);
  el('ellipse', { cx: 540, cy: 566, rx: 34, ry: 7, fill: 'none', stroke: C.orange, 'stroke-width': 6 }, court);
  el('path', { d: 'M 508 568 L 520 610 M 540 572 L 540 612 M 572 568 L 560 610', stroke: '#fff', 'stroke-width': 3, opacity: 0.8 }, court);
})();

// --- personajes
const SKIN = ['#f1c7a1', '#c98d63', '#8a5a3c', '#e8b48c', '#a8714b', '#f3d2b4'];
const HAIR = ['#2a1b12', '#14110f', '#3b2416', '#6b3f1f', '#121212', '#c58b3a'];
function makePerson(shirt, pants, skin, hair, style) {
  const g = el('g', {}, actors);
  const sh = el('ellipse', { rx: 64, ry: 15, fill: '#7a4316', opacity: 0.35 }, g);
  const body = el('g', {}, g);
  const legB = el('path', { fill: 'none', stroke: pants, 'stroke-width': 30, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, body);
  const armB = el('path', { fill: 'none', stroke: skin, 'stroke-width': 21, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, body);
  const legF = el('path', { fill: 'none', stroke: pants, 'stroke-width': 30, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, body);
  const shoeB = el('ellipse', { rx: 22, ry: 11, fill: '#1c1c28' }, body);
  const shoeF = el('ellipse', { rx: 22, ry: 11, fill: '#1c1c28' }, body);
  const torso = el('path', { fill: shirt }, body);
  const num = el('text', { 'font-size': 34, 'font-weight': 900, fill: shirt === C.white ? '#0b1636' : '#f6f3ec', 'text-anchor': 'middle', opacity: 0.8 }, body);
  const neck = el('rect', { x: -11, y: -296, width: 22, height: 24, fill: skin }, body);
  const head = el('g', {}, body);
  el('ellipse', { cx: 0, cy: 0, rx: 37, ry: 40, fill: skin }, head);
  if (style === 0) el('path', { d: 'M -38 -6 Q -40 -46 0 -46 Q 40 -46 38 -6 Q 22 -26 -38 -6 Z', fill: hair }, head);
  else if (style === 1) { el('path', { d: 'M -38 -2 Q -42 -48 0 -48 Q 42 -48 38 -2 Q 10 -30 -38 -2 Z', fill: hair }, head); el('circle', { cx: 0, cy: -48, r: 16, fill: hair }, head); }
  else el('path', { d: 'M -39 4 Q -44 -50 0 -48 Q 44 -50 39 4 L 34 -14 Q 0 -30 -34 -14 Z', fill: hair }, head);
  el('circle', { cx: 13, cy: 2, r: 4, fill: '#1a1a24' }, head);
  el('circle', { cx: -9, cy: 2, r: 4, fill: '#1a1a24' }, head);
  el('path', { d: 'M -6 18 Q 4 24 14 18', fill: 'none', stroke: '#6a3a28', 'stroke-width': 3.5, 'stroke-linecap': 'round' }, head);
  const armF = el('path', { fill: 'none', stroke: skin, 'stroke-width': 21, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, body);
  const sleeveF = el('circle', { r: 17, fill: shirt }, body);
  return { g, sh, body, legB, legF, armB, armF, shoeB, shoeF, torso, num, head, sleeveF, shirt };
}
// cinemática simple de 2 segmentos: devuelve el codo/rodilla para unir origen y destino
function ik(ox, oy, tx, ty, l1, l2, bend) {
  let dx = tx - ox, dy = ty - oy; let d = Math.hypot(dx, dy);
  const maxd = l1 + l2 - 0.5; if (d > maxd) { tx = ox + dx / d * maxd; ty = oy + dy / d * maxd; dx = tx - ox; dy = ty - oy; d = maxd; }
  const a = Math.atan2(dy, dx), c = clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1);
  const b = a + bend * Math.acos(c);
  return { jx: ox + Math.cos(b) * l1, jy: oy + Math.sin(b) * l1, tx, ty };
}
function drawPerson(P, st) {
  // st: x,y,s,facing(±1),phase,stride, handL{x,y}, handR{x,y} (locales), bob
  const p = proj(st.u, st.v);
  set(P.g, { transform: `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) scale(${(p.s * st.face).toFixed(3)},${p.s.toFixed(3)})` });
  set(P.sh, { cx: 0, cy: 0 });
  const bob = Math.abs(Math.sin(st.phase)) * 6 * st.stride;
  set(P.body, { transform: `translate(0,${(-bob).toFixed(1)}) rotate(${(st.lean || 0).toFixed(1)})` });
  const hipY = -150, sw = Math.sin(st.phase) * 34 * st.stride, lift = (k) => Math.max(0, Math.sin(st.phase + k)) * 26 * st.stride;
  const legs = [[P.legB, P.shoeB, -12, sw, lift(0)], [P.legF, P.shoeF, 12, -sw, lift(Math.PI)]];
  for (const [path, shoe, hx, fx, fl] of legs) {
    const k = ik(hx, hipY, hx + fx, -10 - fl + bob, 78, 78, -1);
    set(path, { d: `M ${hx} ${hipY} L ${k.jx.toFixed(1)} ${k.jy.toFixed(1)} L ${k.tx.toFixed(1)} ${k.ty.toFixed(1)}` });
    set(shoe, { cx: (k.tx + 8).toFixed(1), cy: (k.ty + 6).toFixed(1) });
  }
  set(P.torso, { d: 'M -44 -160 Q -50 -230 -40 -268 Q 0 -284 40 -268 Q 50 -230 44 -160 Q 0 -146 -44 -160 Z' });
  set(P.num, { x: 0, y: -196 }); P.num.textContent = st.num || '';
  set(P.head, { transform: `translate(${(st.headX || 4)},-322) rotate(${(st.headR || 0).toFixed(1)})` });
  const arms = [[P.armB, -30, st.handB], [P.armF, 30, st.handF]];
  for (const [path, sx, h] of arms) {
    const k = ik(sx, -258, h.x, h.y, 64, 62, sx < 0 ? 1 : 1);
    set(path, { d: `M ${sx} -258 L ${k.jx.toFixed(1)} ${k.jy.toFixed(1)} L ${k.tx.toFixed(1)} ${k.ty.toFixed(1)}` });
  }
  set(P.sleeveF, { cx: 30, cy: -256 });
  return p;
}

// gorila (figura con disfraz): cuerpo voluminoso, brazos largos, cara clara
function makeGorilla() {
  const g = el('g', {}, actors);
  const sh = el('ellipse', { rx: 90, ry: 20, fill: '#7a4316', opacity: 0.4 }, g);
  const body = el('g', {}, g);
  const fur = '#2b2a33', fur2 = '#3b3a46';
  const legB = el('path', { fill: 'none', stroke: fur, 'stroke-width': 46, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, body);
  const armB = el('path', { fill: 'none', stroke: fur, 'stroke-width': 38, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, body);
  const legF = el('path', { fill: 'none', stroke: fur2, 'stroke-width': 46, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, body);
  const torso = el('path', { fill: fur2, d: 'M -70 -150 Q -86 -250 -54 -300 Q 0 -330 54 -300 Q 86 -250 70 -150 Q 0 -122 -70 -150 Z' }, body);
  el('path', { d: 'M -40 -190 Q 0 -170 40 -190 Q 30 -250 0 -262 Q -30 -250 -40 -190 Z', fill: '#4a4856' }, body);
  const head = el('g', {}, body);
  el('ellipse', { cx: 0, cy: 0, rx: 46, ry: 48, fill: fur }, head);
  el('ellipse', { cx: 4, cy: 10, rx: 30, ry: 28, fill: '#6d6676' }, head);
  el('rect', { x: -26, y: -16, width: 60, height: 14, rx: 7, fill: fur2 }, head);
  el('circle', { cx: -6, cy: -4, r: 5, fill: '#f6f3ec' }, head); el('circle', { cx: 18, cy: -4, r: 5, fill: '#f6f3ec' }, head);
  el('circle', { cx: -6, cy: -4, r: 2.5, fill: '#111' }, head); el('circle', { cx: 18, cy: -4, r: 2.5, fill: '#111' }, head);
  el('ellipse', { cx: 6, cy: 14, rx: 12, ry: 6, fill: '#3b3640' }, head);
  el('path', { d: 'M -8 28 Q 6 34 20 28', stroke: '#2a2530', 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, head);
  const armF = el('path', { fill: 'none', stroke: fur2, 'stroke-width': 38, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, body);
  const handF = el('circle', { r: 22, fill: '#3b3a46' }, body), handB = el('circle', { r: 22, fill: fur }, body);
  return { g, sh, body, legB, legF, armB, armF, head, handF, handB };
}
function drawGorilla(G, st) {
  const p = proj(st.u, st.v);
  set(G.g, { transform: `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) scale(${(p.s * st.face).toFixed(3)},${p.s.toFixed(3)})` });
  const bob = Math.abs(Math.sin(st.phase)) * 10 * st.stride;
  set(G.body, { transform: `translate(0,${(-bob).toFixed(1)}) rotate(${(4 + Math.sin(st.phase) * 2 * st.stride).toFixed(1)})` });
  const hipY = -150, sw = Math.sin(st.phase) * 40 * st.stride, lift = (k) => Math.max(0, Math.sin(st.phase + k)) * 24 * st.stride;
  [[G.legB, -24, sw, lift(0)], [G.legF, 24, -sw, lift(Math.PI)]].forEach(([path, hx, fx, fl]) => {
    const k = ik(hx, hipY, hx + fx, -16 - fl + bob, 76, 76, -1);
    set(path, { d: `M ${hx} ${hipY} L ${k.jx.toFixed(1)} ${k.jy.toFixed(1)} L ${k.tx.toFixed(1)} ${k.ty.toFixed(1)}` });
  });
  set(G.head, { transform: `translate(14,-334) rotate(${(st.headR || 0).toFixed(1)})` });
  [[G.armB, G.handB, -52, st.handB], [G.armF, G.handF, 52, st.handF]].forEach(([path, hand, sx, h]) => {

  const cr = drawCourt(Math.max(tc, 2.6));
  // contador de pases
  const ci = ramp(t, 3.35, 3.75, E.back), co = ramp(t, T.freeze - 0.02, T.freeze + 0.08);
  set(cnt, { opacity: (clamp(ci) * (1 - co)).toFixed(3), transform: `translate(540,${(190 - 40 * (1 - clamp(ci))).toFixed(1)}) scale(${lerp(0.7, 1, clamp(ci)).toFixed(3)})` });
  cntNum.textContent = String(t < 3.2 ? 0 : cr.whiteCount);
  // ---------- escena 3: congelado, círculo, lupa, cerebro
  const gp = proj(cr.gor.u, cr.gor.v); const gc = { x: gp.x, y: gp.y - 190 * gp.s };
  const fz = ramp(t, T.freeze, T.freeze + 0.18);
  const ringK = ramp(t, T.freeze + 0.05, T.freeze + 0.45, E.out);
  const R = 150 * gp.s * 1.35;
  set($('dimHole'), { cx: gc.x, cy: gc.y, r: (R * ringK).toFixed(1) });
  set($('freezeDim'), { opacity: (0.62 * fz).toFixed(3) });
  const circ = 2 * Math.PI * R;
  set(markC, { cx: gc.x, cy: gc.y, r: R.toFixed(1), 'stroke-dasharray': `${circ.toFixed(1)} ${circ.toFixed(1)}`, 'stroke-dashoffset': (circ * (1 - ringK)).toFixed(1), opacity: (t > T.freeze ? 1 : 0), transform: `rotate(-90 ${gc.x} ${gc.y})` });
  set(mark, { opacity: (1 - ramp(t, 8.55, 8.8)).toFixed(3) });
  // lupa: entra sobre el gorila y luego viaja al centro, donde se convierte en cerebro
  const lin = ramp(t, 8.05, 8.42, E.back), lmove = ramp(t, 8.5, 8.95, E.inOut);
  const lx = lerp(lerp(gc.x + 320, gc.x + 30, lin), 540, lmove), ly = lerp(lerp(gc.y + 420, gc.y + 20, lin), 1000, lmove);
  const ls = lerp(0.85, 1.25, lmove) * (1 - ramp(t, 8.9, 9.1, E.in) * 0.15);
  set(lensG, { transform: tr(lx, ly, ls, lerp(-12, 0, lin) + lerp(0, 25, lmove)) });
  set(lens, { opacity: (t > 8.0 ? (1 - ramp(t, 8.98, 9.15)) : 0).toFixed(3) });
  set($('s3bg'), { opacity: ramp(t, 8.5, 8.9).toFixed(3) });
  const bk = ramp(t, 8.85, 9.35, E.back), bOut = 0;
  set(brainIn, { transform: tr(540, 1010, lerp(0.2, 1.08, bk) * (1 + 0.015 * Math.sin(t * 6))) });
  set(brainG, { opacity: clamp(bk * 3).toFixed(3) });
  set(focusSpot, { opacity: (0.85 * ramp(t, 9.3, 9.6) * (0.75 + 0.25 * Math.sin(t * 9))).toFixed(3) });
  const rays = ramp(t, 9.15, 9.6, E.out);
  set(brainRays, { transform: tr(540, 1010, lerp(0.7, 1.08, rays)), opacity: (rays * (1 - ramp(t, 9.75, 10))).toFixed(3) });
  // título final: escala con rebote sutil, palabra a palabra con la voz
  [[tCeg, 7.93], [tPor, 8.5], [tAte, 9.22]].forEach(([o, s]) => {
    const k = ramp(t, s, s + 0.42, E.back);
    set(o.g, { opacity: clamp(k * 2.5).toFixed(3), transform: `translate(540,${o.y - 50}) scale(${lerp(0.3, 1, k).toFixed(3)}) translate(-540,${-(o.y - 50)})` });
  });
  const bar = ramp(t, 9.4, 9.7, E.out);
  set(tBar, { width: (200 * bar).toFixed(1), x: (540 - 100 * bar).toFixed(1), opacity: bar > 0 ? 1 : 0 });
  // identidad final
  const bi = ramp(t, 9.28, 9.7, E.back);
  set(brand, { opacity: clamp(bi * 2).toFixed(3), transform: `translate(${(320).toFixed(1)},${(1790 + 60 * (1 - clamp(bi))).toFixed(1)}) scale(${lerp(0.6, 1, bi).toFixed(3)})` });
  // destello de impacto al congelar
  set($('flash'), { opacity: (0.28 * (1 - ramp(t, T.freeze, T.freeze + 0.2)) * (t >= T.freeze ? 1 : 0)).toFixed(3) });
  drawSubs(t);
}
window.renderFrame = renderFrame;
document.fonts.load('900 40px M').then(() => document.fonts.load('800 40px M')).then(() => {
  const q = new URLSearchParams(location.search);
  renderFrame(Number(q.get('t') || 0));
  window.ready = true;
});
</script>
