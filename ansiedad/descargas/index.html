<title>Ansiedad 3D — Descargas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: una columna estrecha; cada vídeo es una ficha con reproductor vertical y botón de descarga */
  :root {
    --bg: #f3f4f8; --surface: #ffffff; --fg: #15172a; --muted: #5d6178; --line: #dfe1ea;
    --accent: #ffd43b; --accent-ink: #1c1600; --alarm: #e5384f;
    --display: "Montserrat", "Arial Black", system-ui, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0e0f1a; --surface: #171928; --fg: #eef0f8; --muted: #a2a7c0; --line: #2a2d42;
    --accent: #ffd43b; --accent-ink: #1c1600; --alarm: #ff5a6e; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #0e0f1a; --surface: #171928; --fg: #eef0f8; --muted: #a2a7c0; --line: #2a2d42;
    --accent: #ffd43b; --accent-ink: #1c1600; --alarm: #ff5a6e; color-scheme: dark }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; }
  .eyebrow { font-family: var(--display); font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--alarm); }
  h1 { font-family: var(--display); font-weight: 900; font-size: clamp(30px, 8vw, 44px); line-height: 1.02; margin: 4px 0 8px; text-wrap: balance; }
  h1 mark { background: none; color: inherit; box-shadow: inset 0 -0.32em 0 var(--accent); }
  .lead { color: var(--muted); margin: 0; max-width: 60ch; }
  .clip { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 14px; }
  .clip h2 { font-family: var(--display); font-weight: 800; font-size: 18px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin: 0; }
  video { width: 100%; max-width: 100%; aspect-ratio: 9 / 16; max-height: 70vh; background: #000; border-radius: 12px; display: block; margin: 0 auto; object-fit: contain; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button { font-family: var(--display); font-weight: 800; font-size: 15px; border: 0; border-radius: 999px; padding: 13px 22px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  button:hover { filter: brightness(1.05); }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  button[disabled] { opacity: .6; cursor: progress; }
  .status { font-size: 13px; color: var(--muted); min-width: 0; }
  .status.err { color: var(--alarm); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main>
  <header>
    <div class="eyebrow">Motion graphics 3D · 9:16</div>
    <h1>¿Por qué tu cerebro activa una <mark>alarma</mark>?</h1>
    <p class="lead">Vídeos del proyecto «Ansiedad». Pulsa «Descargar MP4» para guardar el archivo en tu dispositivo.</p>
  </header>
  <section id="clips"></section>
</main>

<script>
  // Lista de vídeos publicados junto a esta página
  const CLIPS = [
    { file: 'prueba_10s_1080x1920.mp4', title: 'Prueba de 10 s · Escena 01', meta: '1080 × 1920 · 30 fps · 0:10 · con narración, subtítulos y efectos' },
  ];

  const list = document.getElementById('clips');
  list.style.display = 'grid'; list.style.gap = '18px';
  const dl = (window.claude && claude.use) ? claude.use('downloads') : Promise.resolve(null);

  for (const c of CLIPS) {
    const el = document.createElement('article'); el.className = 'clip';
    el.innerHTML = `<h2></h2><p class="meta"></p><video controls playsinline preload="metadata"></video>
      <div class="row"><button type="button">Descargar MP4</button><span class="status" role="status"></span></div>`;
    el.querySelector('h2').textContent = c.title;
    el.querySelector('.meta').textContent = c.meta;
    el.querySelector('video').src = c.file;
    const btn = el.querySelector('button'), st = el.querySelector('.status');
    btn.addEventListener('click', async () => {
      st.className = 'status'; st.textContent = 'Preparando el archivo…'; btn.disabled = true;
      try {
        const downloads = await dl;
        if (!downloads) throw { code: 'unavailable' };
        const res = await fetch(c.file);
        if (!res.ok) throw { code: 'fetch' };
        const blob = await res.blob();
        st.textContent = 'Confirma la descarga en el aviso.';
        await downloads.save({ filename: c.file, data: blob });
        st.textContent = 'Descargado.';
      } catch (e) {
        st.className = 'status err';
        st.textContent = e && e.code === 'declined' ? 'Descarga cancelada.'
          : e && e.code === 'rate_limited' ? 'Hay otra descarga en curso. Espera unos segundos y vuelve a pulsar.'
          : 'Esta vista no permite descargas. Abre la página en claude.ai desde un navegador.';
      } finally { btn.disabled = false; }
    });
    list.appendChild(el);
  }
</script>
